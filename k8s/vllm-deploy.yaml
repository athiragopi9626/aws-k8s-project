apiVersion: apps/v1
kind: Deployment
metadata:
  name: coding-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: coding-ai
  template:
    metadata:
      labels:
        app: coding-ai
    spec:
      containers:
      - name: vllm
        image: vllm/vllm-openai:latest
        args: ["--model", "deepseek-ai/DeepSeek-Coder-V2-Lite-Instruct"]
        env:
        - name: HUGGING_FACE_HUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-token
              key: token
        ports:
        - containerPort: 8000
        resources:
          limits:
            ://nvidia.com: 1 
      tolerations:
      - key: "://nvidia.com"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"
