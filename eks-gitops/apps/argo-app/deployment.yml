apiVersion: apps/v1
kind: Deployment
metadata:
  name: argo-nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: argo-nginx
  template:
    metadata:
      labels:
        app: argo-nginx
    spec:
      containers:
        - name: nginx
          image: nginx:1.24
          ports:
            - containerPort: 80
          # Add this block to fix the "noisy neighbor" warning:
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "500m"
