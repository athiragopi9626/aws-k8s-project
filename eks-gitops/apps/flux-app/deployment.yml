apiVersion: apps/v1
kind: Deployment
metadata:
  name: flux-nginx
  labels:
    app: flux-nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flux-nginx
  template:
    metadata:
      labels:
        app: flux-nginx
    spec:
      containers:
        - name: nginx
          image: nginx:1.24
          ports:
            - containerPort: 80