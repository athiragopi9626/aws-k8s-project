name: CI Pipeline

on:
  pull_request:
    branches: [ "main" ]

permissions:
  id-token: write
  contents: read

jobs:
  terraform-plan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0

      - name: Terraform Init
        run: terraform -chdir=infrastructure/terraform init

      - name: Terraform Plan
        run: terraform -chdir=infrastructure/terraform plan -out=tfplan
             terraform -chdir=infrastructure/terraform show -no-color tfplan > tfplan.txt

        # Purpose: Preview infrastructure changes safely
        # No AWS resources are created yet
      - name: Post Terraform Plan to PR
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          path: infrastructure/terraform/tfplan.txt

  docker-build:
    runs-on: ubuntu-latest
    needs: terraform-plan

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2
        # Uses GitHub Secrets to authenticate; no credentials in repo

      - name: Build Backend Image
        run: |
          docker build -t backend ./apps/backend
          docker tag backend:latest ${{ secrets.ECR_URI }}/backend:latest
          docker push ${{ secrets.ECR_URI }}/backend:latest
        # Public demo image: python:3.11-slim
        # Purpose: Ensure backend builds correctly

      - name: Build Frontend Image
        run: |
          docker build -t frontend ./apps/frontend
          docker tag frontend:latest ${{ secrets.ECR_URI }}/frontend:latest
          docker push ${{ secrets.ECR_URI }}/frontend:latest
        # Public demo image: node:20-alpine
        # Purpose: Ensure frontend builds correctly